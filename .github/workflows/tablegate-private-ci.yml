name: TableGate pinned private CI

# Public workflow configuration only. No PR triggers or unreviewed external code.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tablegate-private-ci.yml"
      - ".github/tablegate-ci-pin.txt"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "40-character SHA of the private TableGate commit to validate"
        required: false
        type: string
        default: "d9b82563829848d7143f6b2582df3171694fc7dc"

permissions:
  contents: read

# Keep every immutable-source safety gate, but do not let an obsolete
# hung run block a NEW commit's review. Never auto-cancel tested releases.
concurrency:
  group: tablegate-pinned-private-ci-v3-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate pinned commit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      source_sha: ${{ steps.validate.outputs.source_sha }}
    steps:
      - name: Checkout public workflow pin only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - id: validate
        name: Require an immutable private commit SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha || '' }}
        run: |
          set -euo pipefail
          if [[ -z "$REQUESTED_SHA" && -f .github/tablegate-ci-pin.txt ]]; then
            REQUESTED_SHA="$(tr -d '\r\n' < .github/tablegate-ci-pin.txt)"
          fi
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::A valid 40-character private commit SHA is required"
            exit 1
          fi
          printf 'source_sha=%s\n' "$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build / strict types / unit tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private commit without persisting token
        uses: actions/checkout@v4
        with:
          repository: Sidious92/TableGate
          ref: ${{ needs.validate.outputs.source_sha }}
          token: ${{ secrets.THE_TABLEKEEPER_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
          path: private-workspace
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Validate without exposing private output
        working-directory: private-workspace
        shell: bash
        run: |
          set -euo pipefail
          run_private() {
            local stage="$1"; shift
            if "$@" > "$RUNNER_TEMP/tablegate-build-${stage}.log" 2>&1; then
              echo "${stage}: passed"
            else
              if [[ "$stage" == "types" ]]; then
                # Only numeric line locators and TypeScript codes; never private paths or messages.
                hint="$(python3 -c 'import pathlib,re,sys; files=sorted(str(p) for p in pathlib.Path("src").rglob("*") if p.suffix in (".ts",".tsx")); log=re.sub(r"\x1b\[[0-9;]*m","",pathlib.Path(sys.argv[1]).read_text(errors="replace")); errors=re.findall(r"([^\s(:]+\.[jt]sx?)(?:\((\d+),\d+\)|:(\d+):\d+)[^\n]*?(TS\d+)",log,re.M); print(";".join(f"source#{files.index(path)+1} line {a or b} {code}" for path,a,b,code in errors[:12] if path in files) or "ts-codes="+",".join(sorted(set(re.findall(r"TS\d+",log)))[:12]))' "$RUNNER_TEMP/tablegate-build-types.log")"
                [[ -z "$hint" ]] || echo "Type diagnostics (anonymous): $hint"
              fi
              if [[ "$stage" == "unit" ]]; then
                # Emit anonymous failed-suite indices only; never publicize private paths, titles or assertions.
                python3 - "$RUNNER_TEMP/tablegate-build-unit.log" <<'PY'
          import pathlib, re, sys
          ansi = re.compile(r"\x1b\[[0-9;]*m")
          report = ansi.sub("", pathlib.Path(sys.argv[1]).read_text(errors="replace"))
          files = sorted(str(p) for p in pathlib.Path("src").rglob("*") if p.is_file() and re.search(r"\.(test|spec)\.[jt]sx?$", str(p)))
          found = []
          for line in report.splitlines():
              if "FAIL " not in line and not line.strip().startswith("❯ "):
                  continue
              for f in re.findall(r"src/[^\s:]+\.(?:test|spec)\.[jt]sx?", line):
                  if f in files and f not in found:
                      found.append(f)
          print("Anonymized unit failure: suites", len(files), "failure_indices", [files.index(k)+1 for k in found[:16]])
          for f in found[:5]:
              src=pathlib.Path(f).read_text(errors="replace")
              labels=re.findall(r'it\("([^"]+)"',src)
              failed_titles=[line.strip().split(" > ")[-1].strip() for line in report.splitlines()
                  if re.search(r"\\bFAIL\\s+"+re.escape(f)+r"\\s+>",line)]
              marked=[line for line in report.splitlines() if
                  any(symbol in line for symbol in ("×","✗","✕","❯")) or
                  ("FAIL " in line and "src/" in line)]
              failed_cases=[i+1 for i,label in enumerate(labels)
                  if label in failed_titles or
                  any(label in line for line in marked if "src/" not in line or " > " in line)]
              print("Anonymous test cases for suite",files.index(f)+1,
                    "of",len(labels),"failed_indices",failed_cases or ["undetermined"])
              print("Anonymous error categories",
                [kind for kind in ("AssertionError","TestingLibraryElementError","TypeError","ReferenceError")
                 if kind in report][:4])
              stacklines=re.findall(re.escape(f)+r":(\\d+):(\\d+)",report)
              print("Anonymous assertion lines for suite",files.index(f)+1,
                "locations",list(dict.fromkeys(stacklines))[-6:])
          PY
              fi
              if [[ "$stage" == "lore-race" ]]; then
                grep '^V1-LORE-STRESS-FAIL ' "$RUNNER_TEMP/tablegate-build-lore-race.log" || true
              fi
              echo "::error::${stage}: failed (private output deliberately withheld from public Actions)"
              exit 1
            fi
          }
          run_private dependencies bun install --frozen-lockfile
          run_private standalone bun run check:standalone
          if node -e 'process.exit(require("./package.json").scripts["lint:logic"]?0:1)'; then
            run_private lint-logic bun run lint:logic
          else
            echo "lint-logic not defined in this source baseline; full existing ESLint is not part of this hotfix gate"
          fi
          run_private bundle bun run build
          run_private types bunx tsc --noEmit
          run_private header-search bunx vitest run src/test/campaign-header-search.test.tsx
          run_private unit bun run test
          if [[ -f scripts/v1-lore-race-stress.cjs ]]; then
            run_private lore-race node scripts/v1-lore-race-stress.cjs
          else
            echo "Lore race stress script not present in this source baseline"
          fi

  browser:
    name: Browser smoke (local only)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout private commit without persisting token
        uses: actions/checkout@v4
        with:
          repository: Sidious92/TableGate
          ref: ${{ needs.validate.outputs.source_sha }}
          token: ${{ secrets.THE_TABLEKEEPER_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
          path: private-workspace
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Browser setup and smoke without public logs or screenshots
        working-directory: private-workspace
        shell: bash
        run: |
          set -euo pipefail
          run_private() {
            local stage="$1"; shift
            if "$@" > "$RUNNER_TEMP/tablegate-browser-${stage}.log" 2>&1; then
              echo "${stage}: passed"
            else
              echo "::error::${stage}: failed (private output deliberately withheld from public Actions)"
              exit 1
            fi
          }
          run_private dependencies bun install --frozen-lockfile
          run_private playwright-install npm install --prefix .atlas-ci --no-save --no-audit --no-fund playwright@1.56.1
          run_private browser-install ./.atlas-ci/node_modules/.bin/playwright install --with-deps chromium
          bun run dev -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/tablegate-vite.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" != "1" ]]; then
            echo "::error::local-browser-server: failed (private server log withheld)"
            exit 1
          fi
          echo "Local browser server: ready"
          export ATLAS_BASE_URL=http://127.0.0.1:4173
          run_private browser-smoke node scripts/atlas-browser-smoke.cjs

  sql:
    name: Disposable local Supabase / SQL / RLS / Storage
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ATLAS_ISOLATED_SQL_TEST: "yes"
    steps:
      - name: Checkout private commit without persisting token
        uses: actions/checkout@v4
        with:
          repository: Sidious92/TableGate
          ref: ${{ needs.validate.outputs.source_sha }}
          token: ${{ secrets.THE_TABLEKEEPER_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
          path: private-workspace
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Run isolated SQL in local Docker without public details
        working-directory: private-workspace
        shell: bash
        run: |
          set -euo pipefail
          if bash scripts/atlas-isolated-sql-ci.sh > "$RUNNER_TEMP/tablegate-private-sql.log" 2>&1; then
            echo "Disposable SQL/RLS/Storage validation: passed"
          else
            stage_code="$?"
            # Encrypt diagnostic without a shell heredoc.
            node -e 'const fs=require("node:fs"),crypto=require("node:crypto"),zlib=require("node:zlib");const payload=fs.readFileSync(process.argv[1],"utf8").slice(-15000);const pub="-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0I6Zj6VyA6UFl901noyZ\nhdtoury9zd2Ifot2HffKZRyUByPExxkHrePfXyBqD16+8yde6tV3U01P6lg7CxeM\n0KLCGp9jCXRYHTMYudDFV9qIPZ+W5C5d7Ze0gne1hm8azhfiWd/oVl4NIkpsb9Gi\nPKrTT58PAPkX1fC0i75fz5vTUIzeXiwH/NqvxW20CTarIfgzDVmaexN8AXud4ykO\nymYu07bJxgOirSByqkTcPCFUU2jFeK9oyom9MVkdHVN7oAaUce08pQsJQZ8/kuSJ\nWTuF7xANCyNv1kgnpTaJHFkrJllwmvCRcc5Elc0bcrvqabieNxaZyiS1lA3yuErF\nXwIDAQAB\n-----END PUBLIC KEY-----";const key=crypto.randomBytes(32),iv=crypto.randomBytes(12);const c=crypto.createCipheriv("aes-256-gcm",key,iv);const sealed=Buffer.concat([c.update(zlib.gzipSync(Buffer.from(payload))),c.final()]);const wrapped=crypto.publicEncrypt({key:pub,oaepHash:"sha256"},key);const len=Buffer.alloc(2);len.writeUInt16BE(wrapped.length);console.log("TG-CHAT-DIAG "+Buffer.concat([Buffer.from("TG19"),len,wrapped,iv,c.getAuthTag(),sealed]).toString("base64"));' "$RUNNER_TEMP/tablegate-private-sql.log"
            # Only a numeric psql line locator escapes the ephemeral private log.
            # Never print SQL source, SQL errors, paths, tokens, or runner files.
            sql_line="$(sed -nE 's/^psql:.*:([0-9]+): (ERROR|FATAL):.*/\1/p' "$RUNNER_TEMP/tablegate-private-sql.log" | tail -n 1)"
            sql_state="$(sed -nE 's/^psql:.*:([0-9]+): (ERROR|FATAL):[[:space:]]*([0-9A-Z]{5}):.*/\3/p' "$RUNNER_TEMP/tablegate-private-sql.log" | tail -n 1)"
            state_suffix=""
            if [[ "$sql_state" =~ ^[0-9A-Z]{5}$ ]]; then state_suffix=", SQLSTATE $sql_state"; fi
            if [[ "$sql_line" =~ ^[0-9]{1,5}$ ]]; then
              echo "::error::Disposable SQL validation failed: phase $stage_code, SQL line $sql_line$state_suffix (details withheld)"
            else
              echo "::error::Disposable SQL validation failed: phase $stage_code$state_suffix (details withheld)"
            fi
            exit 1
          fi
      - name: Authenticated browser role matrix (local Supabase only)
        working-directory: private-workspace
        shell: bash
        run: |
          set -euo pipefail
          run_private() {
            local stage="$1"; shift
            if "$@" > "$RUNNER_TEMP/tablegate-role-browser-$stage.log" 2>&1; then
              echo "$stage: passed"
            else
              if [[ "$stage" == "role-matrix" ]]; then
                qa_phase="$(sed -nE 's/^CI-QA-FAIL-PHASE=([0-9]{1,3})$/\1/p' "$RUNNER_TEMP/tablegate-role-browser-$stage.log" | tail -n 1)"
                error_kind="$(sed -nE 's/^CI-QA-ERROR-KIND=(TIMEOUT|ASSERTION|HTTP|OTHER)$/\\1/p' "$RUNNER_TEMP/tablegate-role-browser-$stage.log" | tail -n 1)"
                [[ -z "$error_kind" ]] || echo "Anonymous role QA error category: $error_kind"
                if [[ "$qa_phase" =~ ^[0-9]{1,3}$ ]]; then
                  echo "::error::$stage: failed at QA phase $qa_phase (private browser logs withheld)"
                else
                  echo "::error::$stage: failed (private browser logs withheld)"
                fi
              else
                echo "::error::$stage: failed (private browser logs withheld)"
              fi
              exit 1
            fi
          }
          run_private role-dependencies bun install --frozen-lockfile
          run_private role-playwright-install npm install --prefix .atlas-ci --no-save --no-audit --no-fund playwright@1.56.1
          run_private role-chromium-install ./.atlas-ci/node_modules/.bin/playwright install --with-deps chromium
          set -a
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|PUBLISHABLE_KEY|SECRET_KEY)=')"
          set +a
          run_private role-matrix node scripts/tablegate-role-browser-ci.cjs
      - name: Stop disposable local Supabase
        if: always()
        working-directory: private-workspace
        shell: bash
        run: |
          supabase stop --no-backup > "$RUNNER_TEMP/tablegate-supabase-stop.log" 2>&1 || true

  audit:
    name: Full V1 source inventory / lint / dependency security
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pinned private commit without persisting token
        uses: actions/checkout@v4
        with:
          repository: Sidious92/TableGate
          ref: ${{ needs.validate.outputs.source_sha }}
          token: ${{ secrets.THE_TABLEKEEPER_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
          path: private-workspace
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Full tracked-line audit with private findings withheld
        working-directory: private-workspace
        shell: bash
        run: |
          set -euo pipefail
          if ! bun install --frozen-lockfile > "$RUNNER_TEMP/private-audit-install.log" 2>&1; then
            echo "::error::V1 dependency installation failed (details withheld)"
            exit 1
          fi
          if [[ ! -f scripts/tablegate-v1-mega-audit.mjs ]]; then
            echo "V1 mega-audit script not in this source baseline; audited in PR #103 instead"
            exit 0
          fi
          if node scripts/tablegate-v1-mega-audit.mjs --tooling > "$RUNNER_TEMP/private-audit-summary.log" 2>&1; then
            grep '^V1-AUDIT-' "$RUNNER_TEMP/private-audit-summary.log" || true
            echo "Full tracked-file lexical scan completed; findings require manual review."
          else
            echo "::error::V1 line inventory or analyzer failed (private details withheld)"
            exit 1
          fi


  zod4-sandbox:
    name: Committed V1 dependency security gate
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact pinned private source without persisting token
        uses: actions/checkout@v4
        with:
          repository: Sidious92/TableGate
          ref: ${{ needs.validate.outputs.source_sha }}
          token: ${{ secrets.THE_TABLEKEEPER_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
          path: private-workspace
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Verify patched committed dependency graph
        working-directory: private-workspace
        shell: bash
        run: |
          set -euo pipefail
          if ! bun install --frozen-lockfile > "$RUNNER_TEMP/tg-zod-install.log" 2>&1; then
            echo "::error::Zod sandbox install failed (private logs withheld)"
            exit 1
          fi
          if [[ ! -f scripts/v1-security-removal-sandbox.cjs ]]; then
            echo "Dependency remediation sandbox not in this source baseline; tracked under PR #103"
            exit 0
          fi
          if node scripts/v1-security-removal-sandbox.cjs > "$RUNNER_TEMP/tg-zod-summary.log" 2>&1; then
            grep '^V1-SEC-' "$RUNNER_TEMP/tg-zod-summary.log" || true
            echo "Committed dependency graph verified in isolated CI."
          else
            grep '^V1-SEC-' "$RUNNER_TEMP/tg-zod-summary.log" || true
            echo "::error::Security dependency trial incompatible or incomplete (private logs withheld)"
            exit 1
          fi

